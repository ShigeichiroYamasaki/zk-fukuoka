<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 310" role="img" aria-labelledby="title desc">
  <title id="title">Cook–Levinの定理による計算の充足可能性への変換</title>
  <desc id="desc">固定入力xの検証計算を回路C_xに変換する。あるウィットネスwでC_x(w)=1となることとxがLに属することは同値。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2456a6"/></marker></defs>
  <rect width="1080" height="310" rx="18" fill="#f5f8ff"/>
  <g font-family="system-ui, sans-serif" fill="#17243a" text-anchor="middle">
    <text x="540" y="36" font-size="22" font-weight="700">Cook–Levin：受理計算が存在する ⇔ 充足可能な回路がある</text>
    <rect x="50" y="104" width="190" height="82" rx="14" fill="#e8eafa" stroke="#5552a5" stroke-width="3"/>
    <text x="145" y="137" font-size="20" font-weight="700">入力 x を固定</text><text x="145" y="165" font-size="16">言語 L の判定問題</text>
    <rect x="330" y="104" width="245" height="82" rx="14" fill="#dce9ff" stroke="#2456a6" stroke-width="3"/>
    <text x="452" y="137" font-size="20" font-weight="700">検証計算を回路化</text><text x="452" y="165" font-size="17">Cₓ(w) を計算</text>
    <rect x="680" y="104" width="190" height="82" rx="14" fill="#e5f5ed" stroke="#28744b" stroke-width="3"/>
    <text x="775" y="137" font-size="20" font-weight="700">回路 Cₓ</text><text x="775" y="165" font-size="17">w が入力</text>
    <rect x="905" y="91" width="145" height="55" rx="12" fill="#e5f5ed" stroke="#28744b" stroke-width="2"/>
    <text x="977" y="125" font-size="18" font-weight="700">Cₓ(w)=1</text>
    <rect x="905" y="160" width="145" height="55" rx="12" fill="#fff0dc" stroke="#a65b16" stroke-width="2"/>
    <text x="977" y="194" font-size="18" font-weight="700">Cₓ(w)=0</text>
    <text x="540" y="257" font-size="20" font-weight="700">x ∈ L  ⇔  ∃ w : Cₓ(w)=1</text>
    <text x="540" y="284" font-size="15">入力 x ごとに回路を構成し，出力を1にするウィットネスがあるかを問う</text>
  </g>
  <g fill="none" stroke="#2456a6" stroke-width="4" marker-end="url(#arrow)">
    <path d="M240 145H330"/><path d="M575 145H680"/><path d="M870 126H905"/><path d="M870 164H905"/>
  </g>
</svg>
