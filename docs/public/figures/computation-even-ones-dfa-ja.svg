<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">1の個数の偶奇を判定する有限オートマトン</title>
  <desc id="desc">偶数状態Eは初期状態かつ受理状態。0では状態を保ち，1では奇数状態Oと切り替わる。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2456a6"/></marker></defs>
  <rect width="900" height="300" rx="18" fill="#f5f8ff"/>
  <g font-family="system-ui, sans-serif" fill="#17243a">
    <text x="450" y="34" text-anchor="middle" font-size="22" font-weight="700">読んだ 1 の個数の偶奇だけを記憶する</text>
    <circle cx="310" cy="160" r="70" fill="#e5f5ed" stroke="#28744b" stroke-width="4"/>
    <circle cx="310" cy="160" r="60" fill="none" stroke="#28744b" stroke-width="2"/>
    <circle cx="610" cy="160" r="70" fill="#fff0dc" stroke="#a65b16" stroke-width="4"/>
    <text x="310" y="153" text-anchor="middle" font-size="29" font-weight="700">E</text>
    <text x="310" y="181" text-anchor="middle" font-size="16">偶数・受理</text>
    <text x="610" y="153" text-anchor="middle" font-size="29" font-weight="700">O</text>
    <text x="610" y="181" text-anchor="middle" font-size="16">奇数</text>
    <text x="310" y="247" text-anchor="middle" font-size="17">初期状態</text>
    <text x="50" y="163" font-size="17">開始</text>
  </g>
  <g fill="none" stroke="#2456a6" stroke-width="4" marker-end="url(#arrow)">
    <path d="M85 158H225"/><path d="M380 115H540"/><path d="M540 205H380"/>
    <path d="M264 99C215 51 402 45 356 100"/><path d="M565 99C516 51 703 45 656 100"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#17243a" text-anchor="middle">
    <text x="460" y="103">1</text><text x="460" y="225">1</text><text x="310" y="65">0</text><text x="610" y="65">0</text>
  </g>
</svg>
